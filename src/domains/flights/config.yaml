domain: flights
required: [name, duration, stops, price, departure_time, arrival_time, airline]
optional: []
selectors:
  kayak.com:
    name: ['[data-resultid]', '.itinerary-details']
    duration: ['[class*="duration"]']
    stops: ['[class*="stops"]']
    price: ['[class*="price"]']
    departure_time: ['[class*="depart-time"]','.depart-time']
    arrival_time: ['[class*="arrival-time"]','.arrival-time']
    airline: ['[class*="airline"]']
  tripadvisor.com:
    name: ['h1','.route-title']
    duration: ['[class*="duration"]']
    stops: ['[class*="stops"]']
    price: ['[class*="price"]']
    departure_time: ['[class*="depart"]']
    arrival_time: ['[class*="arrive"]']
    airline: ['[class*="airline"]']
fallback:
  name: ['h1','h2']
  duration: ['[class*="duration"]']
  stops: ['[class*="stop"]']
  price: ['[class*="price"]']
  departure_time: ['[class*="depart"]']
  arrival_time: ['[class*="arriv"]']
  airline: ['[class*="airline"]']
